<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Tina ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
}

.page{
    position:absolute;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#page2{
    display:none;
    overflow:hidden;
}

h1{
    color:white;
    font-size:55px;
    text-shadow:2px 2px 10px black;
    animation:glow 2s infinite alternate;
    text-align:center;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 35px hotpink;
    }
}

button{
    margin-top:30px;
    padding:18px 45px;
    border:none;
    border-radius:40px;
    background:#ff4081;
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
    background:#ff0066;
}

.balloon{
    position:absolute;
    bottom:-150px;
    font-size:60px;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}

.heart{
    position:absolute;
    top:-50px;
    color:red;
    font-size:25px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px) rotate(0deg);
    }
    to{
        transform:translateY(120vh) rotate(360deg);
    }
}

.confetti{
    position:absolute;
    width:10px;
    height:18px;
    animation:confettiFall linear infinite;
}

@keyframes confettiFall{
    from{
        transform:translateY(-100px) rotate(0);
    }
    to{
        transform:translateY(120vh) rotate(720deg);
    }
}

.message{
    position:relative;
    z-index:10;
    text-align:center;
}

.message p{
    margin-top:20px;
    color:white;
    font-size:28px;
    text-shadow:2px 2px 8px black;
}
</style>

</head>

<body>

<div id="page1" class="page">
<h1>🎁 Here's a Surprise for You Tina 💝</h1>
<button onclick="startParty()">Tap Here ❤️</button>
</div>

<div id="page2" class="page">

<div class="message">
<h1>🎉 Happy Birthday Tina 🫶🎂</h1>
<p>
May your smile always shine brighter than the stars ✨❤️<br><br>
Wishing you endless happiness, love, laughter and all your dreams come true! 🌹💕
</p>
</div>

</div>

<script>

function startParty(){

document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="flex";

createBalloons();
createHearts();
createConfetti();

}

// Balloons
function createBalloons(){

const emojis=["🎈","🎈","🎈","🎈","🎈","🎈"];

setInterval(()=>{

let b=document.createElement("div");
b.className="balloon";
b.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

b.style.left=Math.random()*100+"vw";
b.style.animationDuration=(6+Math.random()*4)+"s";

document.body.appendChild(b);

setTimeout(()=>{
b.remove();
},10000);

},300);

}

// Hearts
function createHearts(){

setInterval(()=>{

let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*3)+"s";
h.style.fontSize=(15+Math.random()*30)+"px";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},8000);

},150);

}

// Confetti

function createConfetti(){

const colors=["red","yellow","blue","green","white","orange","pink","purple"];

setInterval(()=>{

let c=document.createElement("div");
c.className="confetti";

c.style.left=Math.random()*100+"vw";
c.style.background=colors[Math.floor(Math.random()*colors.length)];
c.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},7000);

},60);

}

</script>

</body>
</html>
